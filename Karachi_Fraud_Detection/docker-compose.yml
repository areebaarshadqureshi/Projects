version: "3.9"

services:
  anomaly-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karachi-fraud-detection-api
    ports:
      - "8000:8000"
    volumes:
      # Mount models directory as read-only
      - ./models:/app/models:ro
    environment:
      - MODEL_PATH=/app/models/fraud_detector_v1.pkl
      - ARTIFACTS_PATH=/app/models/artifacts
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fraud-detection-network

networks:
  fraud-detection-network:
    driver: bridge
